name: Build DriveTidy for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies and resolve lockfile
        # The Electron packaging dependencies were added after the previous
        # lockfile snapshot. Bun updates bun.lock here; commit the uploaded
        # lockfile artifact after this first successful build.
        run: bun install

      - name: Report lockfile changes
        shell: pwsh
        run: |
          git diff --quiet -- bun.lock
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::bun.lock was refreshed. Download the DriveTidy-Bun-Lockfile artifact and commit it before the next release build."
          } else {
            Write-Host "bun.lock is already current."
          }

      - name: Run tests
        run: bun run test

      - name: Build, verify and package Windows installer
        run: bun run desktop:win

      - name: Generate installer SHA-256 checksum
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          if (-not $lines) { throw "No Windows installer was produced." }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Upload refreshed Bun lockfile
        uses: actions/upload-artifact@v4
        with:
          name: DriveTidy-Bun-Lockfile
          path: bun.lock
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: DriveTidy-Windows-Installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
