
name: Build DriveTidy for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        working-directory: ./DriveTidy
        run: bun install

      - name: Run tests
        working-directory: ./DriveTidy
        run: bun run test

      - name: Build Windows installer
        working-directory: ./DriveTidy
        run: bun run desktop:win

      - name: Generate checksum
        shell: pwsh
        working-directory: ./DriveTidy
        run: |
          $lines = Get-ChildItem release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          if (-not $lines) { throw "No installer found." }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DriveTidy-Windows-Installer
          path: |
            DriveTidy/release/*.exe
            DriveTidy/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: DriveTidy-Bun-Lockfile
          path: DriveTidy/bun.lock
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DriveTidy/release/*.exe
            DriveTidy/release/SHA256SUMS.txt
